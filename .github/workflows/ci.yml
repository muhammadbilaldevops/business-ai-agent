name: Quality checks
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/ruff check src apps/api tests scripts
      - run: .venv/bin/ruff format --check src apps/api tests scripts
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest -q --junitxml=test-results/backend.xml
      - run: .venv/bin/python scripts/run_evaluation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            test-results
            docs/evaluation-results.json
  frontend-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - run: pnpm exec eslint app/page.tsx lib/api.ts lib/demo.ts lib/localops-types.ts components/analysis-result.tsx components/voice-panel.tsx
        working-directory: apps/web
      - run: node --experimental-strip-types --test apps/web/tests/unit/demo.test.mjs
      - run: node scripts/build-web.mjs
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt && .venv/bin/pip install --no-deps -e .
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm exec playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:8000/api/health
      - run: docker compose down
        if: always()
