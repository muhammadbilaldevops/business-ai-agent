services:
  - type: web
    name: business-ai-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps -e .
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: LOCALOPS_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: LOCALOPS_API_KEY
        generateValue: true
      - key: LOCALOPS_ALLOWED_ORIGINS
        sync: false
      - key: LOCALOPS_DATA_DIR
        value: /tmp/business-ai-agent
# Free service storage resets on restarts/redeploys. For durable uploads,
# switch to a paid instance, mount a disk at /var/data, and set
# LOCALOPS_DATA_DIR=/var/data/business-ai-agent.
